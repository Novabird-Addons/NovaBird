<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body { font: message-box; font-size: 0.95rem; margin: 0; width: 36rem; }
    body.win { width: auto; }
    body.win #out { max-height: calc(100vh - 10rem); }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 18px 6px; }
    header b { font-size: 1.1em; }
    #model { margin-inline-start: auto; font-size: .85em; opacity: .6; }
    #out { padding: 4px 18px 12px; line-height: 1.5; white-space: pre-wrap; min-height: 10em; max-height: 32rem; overflow-y: auto; user-select: text; }
    #warn { margin: 0 18px 8px; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, #b3261e 14%, transparent); color: inherit; font-size: .9em; }
    #note { padding: 0 18px 8px; font-size: .85em; opacity: .7; }
    #err { padding: 4px 18px 10px; color: #b3261e; white-space: pre-wrap; }
    footer { display: flex; gap: 8px; padding: 10px 18px 14px; border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><b id="title"></b><span id="model"></span></header>
  <div id="out"></div>
  <div id="warn" hidden></div>
  <div id="note" hidden></div>
  <div id="err" hidden></div>
  <footer>
    <button type="button" id="again"></button>
    <button type="button" id="copy"></button>
    <button type="button" id="settings"></button>
  </footer>
  <script src="ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ai.css">
</head>
<body>
  <header>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-mode="summary" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span></span>
      </button>
      <button type="button" role="tab" data-mode="translate" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.6 3 2.6 5.6 5 7M11 5c-.8 3.6-3.2 6.6-6.5 8.5M13 21l4-10 4 10M14.5 17.5h5"/></svg><span></span>
      </button>
      <button type="button" role="tab" data-mode="events" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span></span>
      </button>
    </div>
    <span class="model" id="model"></span>
    <button type="button" class="icon-btn" id="detach"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7.5" width="13" height="13" rx="2"/><path d="M8 4h11.5a1 1 0 0 1 1 1V16.5"/></svg></button>
  </header>
  <div class="bar" id="translateBar" hidden>
    <label><span id="toLabel"></span> <select id="toLang"></select></label>
  </div>
  <div class="out" id="out" role="tabpanel"></div>
  <ul class="items" id="items" hidden></ul>
  <div class="warn" id="warn" hidden></div>
  <div class="note-line" id="note" hidden></div>
  <div class="err" id="err" hidden></div>
  <footer>
    <button type="button" class="primary" id="toCalendar" hidden></button>
    <button type="button" id="again"></button>
    <button type="button" id="copy"></button>
    <span class="spacer"></span>
    <button type="button" class="link" id="settings"></button>
  </footer>
  <script src="ai.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ai.css">
</head>
<body class="overview">
  <header>
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9 6 9-6M3.5 5h17v14h-17z"/></svg>
    <b id="title"></b>
    <span class="model" id="model"></span>
  </header>
  <div class="bar">
    <label><span id="periodLabel"></span> <select id="period"></select></label>
    <label><input type="checkbox" id="unread"> <span id="unreadLabel"></span></label>
    <span class="spacer"></span>
    <button type="button" class="sched-btn" id="schedBtn" aria-expanded="false" aria-controls="schedPanel"><span id="schedLabel"></span>: <b id="schedSum"></b></button>
  </div>
  <div class="sched-panel" id="schedPanel" hidden>
    <label><input type="radio" name="schedMode" value="off"> <span id="schedOffLabel"></span></label>
    <div class="sched-row">
      <label><input type="radio" name="schedMode" value="daily"> <span id="schedDailyLabel"></span></label>
      <span class="sched-times" id="schedTimes"></span>
      <button type="button" class="link" id="schedAdd"></button>
    </div>
    <div class="sched-row">
      <label><input type="radio" name="schedMode" value="hours"> <span id="schedEveryLabel"></span></label>
      <select id="schedEvery"></select>
    </div>
    <div class="sched-end"><button type="button" class="primary" id="schedDone"></button></div>
  </div>
  <div class="scroll">
    <div class="out" id="out"></div>
    <div class="deadlines" id="deadlines" hidden></div>
    <div class="warn" id="warn" hidden></div>
    <div class="note-line" id="note" hidden></div>
    <div class="err" id="err" hidden></div>
  </div>
  <footer>
    <button type="button" class="primary" id="tasks" hidden></button>
    <select id="taskCal" hidden></select>
    <button type="button" id="again"></button>
    <button type="button" id="copy"></button>
    <button type="button" id="speak" hidden></button>
    <span class="spacer"></span>
    <button type="button" class="link" id="settings"></button>
  </footer>
  <script src="../shared/nbnet.js"></script>
  <script src="ai.js"></script>
  <script src="deadlines.js"></script>
  <script src="overview.js"></script>
</body>
</html>

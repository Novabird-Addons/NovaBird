<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NovaBird-Extension</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: message-box; margin: 16px; max-width: 70em; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(19em, 1fr)); gap: 0 32px; align-items: start; }
    .cols .opt { gap: 12px; }
    .cols .opt .txt { flex: 1 1 8em; }
    label.off { color: color-mix(in srgb, currentColor 42%, transparent); pointer-events: none; }
    label.off input { accent-color: color-mix(in srgb, currentColor 42%, transparent); }
    #listTab .wide { max-width: 38em; }
    nav { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
    nav button { border: 0; background: none; padding: 8px 14px; font: inherit; color: inherit; border-bottom: 2px solid transparent; cursor: pointer; }
    nav button[aria-selected="true"] { border-bottom-color: #2F6BD8; font-weight: 600; }
    section[hidden] { display: none; }
    h3 { margin: 22px 0 6px; }
    h4 { margin: 20px 0 4px; font-size: 1.05em; }
    label { display: block; margin: 8px 0; }
    .color { display: flex; align-items: center; gap: 10px; margin: 6px 0 6px 22px; }
    .color input { width: 3em; height: 1.8em; padding: 0; }
    .color span { min-width: 12em; }
    #colors[disabled] { opacity: 0.45; }
    #hint { opacity: .65; margin-top: 16px; }
    #pilotDesc, #previewDesc, #listIntro, #listNote, #listAcctNote, #listDensityNote { line-height: 1.5; margin: 10px 0 14px 0; color: color-mix(in srgb, currentColor 78%, transparent); }
    #reset { margin-top: 10px; }
    .opt { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .opt .txt { flex: 1 1 18em; min-width: 0; }
    figure { margin: 8px 0 0; flex: none; text-align: center; }
    figure svg { width: 200px; height: auto; display: block; border-radius: 8px; background: color-mix(in srgb, currentColor 5%, transparent); border: 1px solid color-mix(in srgb, currentColor 18%, transparent); }
    .cap { display: block; font-size: 12px; opacity: .75; margin-top: 4px; }
    .fr { fill: none; stroke: currentColor; stroke-opacity: .4; stroke-width: 1; }
    .bar { fill: currentColor; fill-opacity: .28; }
    .band { fill: currentColor; fill-opacity: .14; }
    .acc { fill: #2F6BD8; }
    .accl { fill: #2F6BD8; fill-opacity: .25; }
    .dash { stroke: currentColor; stroke-opacity: .5; stroke-dasharray: 3 2; stroke-width: 1; }
    .solid { stroke: currentColor; stroke-opacity: .6; stroke-width: 2; }
  </style>
</head>
<body>
  <div id="nb-selftest" hidden></div>
  <h2 id="title"></h2>
  <nav>
    <button type="button" data-tab="list" id="tabList"></button>
    <button type="button" data-tab="calendar" id="tabCalendar"></button>
    <button type="button" data-tab="colors" id="tabColors"></button>
    <button type="button" data-tab="preview" id="tabPreview"></button>
    <button type="button" data-tab="pilot" id="tabPilot"></button>
  </nav>

  <section id="calendar" hidden>
    <h3 id="layoutTitle"></h3>
    <div class="opt">
      <div class="txt">
        <label><input type="radio" name="paneLayout" value="nova"> <span id="layoutNova"></span></label>
        <label><input type="radio" name="paneLayout" value="default"> <span id="layoutDefault"></span></label>
      </div>
      <figure><div id="layoutPreview"></div></figure>
    </div>
    <h3 id="agendaTitle"></h3>
    <label><span id="agendaLabel"></span> <input type="number" id="agendaDays" min="1" max="28" style="width:4em"></label>
    <h3 id="attachTitle"></h3>
    <div class="opt">
      <div class="txt">
        <label><input type="checkbox" id="attachPane"> <span id="attachLabel"></span></label>
        <button id="resetAttach" type="button"></button>
      </div>
      <figure><div id="attachPreview"></div></figure>
    </div>
  </section>

  <section id="listTab">
    <h3 id="listTitle"></h3>
    <p id="listIntro"></p>
    <div class="cols">
    <div>
    <h4 id="listStyleTitle"></h4>
    <div class="opt"><div class="txt"><label><input type="radio" name="listStyle" value="default"> <b id="listDefault"></b><br><small id="listDefaultDesc"></small></label></div><figure id="sk_default"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listStyle" value="soft"> <b id="listSoft"></b><br><small id="listSoftDesc"></small></label></div><figure id="sk_soft"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listStyle" value="clear"> <b id="listClear"></b><br><small id="listClearDesc"></small></label></div><figure id="sk_clear"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listStyle" value="thread"> <b id="listThread"></b><br><small id="listThreadDesc"></small></label></div><figure id="sk_thread"></figure></div>
    </div>
    <div>
    <h4 id="listDensityTitle"></h4>
    <div class="opt"><div class="txt"><label><input type="radio" name="listDensity" value="airy"> <b id="dAiry"></b><br><small id="dAiryDesc"></small></label></div><figure id="sd_airy"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listDensity" value="normal"> <b id="dNormal"></b><br><small id="dNormalDesc"></small></label></div><figure id="sd_normal"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listDensity" value="compact"> <b id="dCompact"></b><br><small id="dCompactDesc"></small></label></div><figure id="sd_compact"></figure></div>
    </div>
    <div>
    <h4 id="listAcctTitle"></h4>
    <div class="opt"><div class="txt"><label><input type="radio" name="listAcct" value="none"> <b id="aNone"></b><br><small id="aNoneDesc"></small></label></div><figure id="sa_none"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listAcct" value="bar"> <b id="aBar"></b><br><small id="aBarDesc"></small></label></div><figure id="sa_bar"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listAcct" value="ring"> <b id="aRing"></b><br><small id="aRingDesc"></small></label></div><figure id="sa_ring"></figure></div>
    <div class="opt"><div class="txt"><label><input type="radio" name="listAcct" value="dot"> <b id="aDot"></b><br><small id="aDotDesc"></small></label></div><figure id="sa_dot"></figure></div>
    <p id="listAcctColorsLabel" style="margin:10px 0 2px"></p>
    <div id="acctColors"></div>
    <p id="listAcctNote"></p>
    </div>
    </div>
    <h4 id="listDetailsTitle"></h4>
    <label><input type="checkbox" id="listPreview"> <span id="listPreviewLabel"></span></label>
    <label><input type="checkbox" id="listAvatars"> <span id="listAvatarsLabel"></span></label>
    <label><input type="checkbox" id="listScroll"> <span id="listScrollLabel"></span></label>
    <p id="listNote"></p>
    <p id="listDensityNote"></p>
  </section>

  <section id="colorsTab" hidden>
    <h3 id="colorTitle"></h3>
    <label><input type="radio" name="colorMode" value="theme"> <span id="modeTheme"></span></label>
    <label><input type="radio" name="colorMode" value="custom"> <span id="modeCustom"></span></label>
    <fieldset id="colors" style="border:none;padding:0;margin:0">
      <div class="color"><input type="color" id="bg"><span id="bgLabel"></span></div>
      <div class="color"><input type="color" id="fg"><span id="fgLabel"></span></div>
      <div class="color"><input type="color" id="border"><span id="borderLabel"></span></div>
      <div class="color"><input type="color" id="accent"><span id="accentLabel"></span></div>
      <button id="reset" type="button"></button>
    </fieldset>
  </section>

  <section id="previewTab" hidden>
    <h3 id="previewTitle"></h3>
    <label><input type="checkbox" id="previewEnabled"> <span id="previewEnableLabel"></span></label>
    <p id="previewDesc"></p>
    <label><span id="previewDelayLabel"></span>
      <select id="previewDelay">
        <option value="200">0,2 s</option>
        <option value="400">0,4 s</option>
        <option value="800">0,8 s</option>
        <option value="1500">1,5 s</option>
      </select></label>
  </section>

  <section id="pilotTab" hidden>
    <h3 id="pilotTitle"></h3>
    <label><input type="checkbox" id="pilotEnabled"> <span id="pilotEnableLabel"></span></label>
    <p id="pilotDesc"></p>
    <label><input type="checkbox" id="pilotLog"> <span id="pilotLogLabel"></span></label>
  </section>

  <section id="diag">
    <h3 id="diagTitle"></h3>
    <button id="diagBtn" type="button"></button>
    <pre id="diagOut" style="white-space:pre-wrap;user-select:text"></pre>
  </section>
  <p id="hint"></p>
  <script src="../shared/selftest-ui.js"></script>
  <script src="options.js"></script>
</body>
</html>

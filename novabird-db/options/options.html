<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
    :root { color-scheme: light dark; }
    body { font: menu; font-size: 13px; padding: 16px; max-width: 580px; }
    h2 { font-size: 14px; margin: 22px 0 8px; }
    h2:first-of-type { margin-top: 0; }
    .row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
    .hint { color: GrayText; font-size: 12px; margin: 4px 0 0; }
    dl { display: grid; grid-template-columns: 180px 1fr; gap: 4px 8px; margin: 0; }
    dt { color: GrayText; } dd { margin: 0; }
    #msg { color: AccentColor; min-height: 1.2em; }
    #events { font: 11px monospace; height: 220px; overflow: auto; border: 1px solid GrayText; padding: 4px 6px; margin: 6px 0; white-space: pre-wrap; background: Field; color: FieldText; }
    #events .warn { color: #8a6d00; } #events .error { color: #b3261e; }
    button.danger { color: #b3261e; }
  </style>
</head>
<body>
  <h2 data-i18n="optHStatus"></h2>
  <dl id="status"></dl>

  <h2 data-i18n="optHIndexing"></h2>
  <div class="row">
    <button id="pause"></button>
  </div>
  <p class="hint" data-i18n="optIndexingHint"></p>

  <h2 data-i18n="optHLog"></h2>
  <div id="events"></div>
  <div class="row">
    <button id="copyEvents" data-i18n="optCopy"></button>
    <button id="clearEvents" data-i18n="optClearEvents"></button>
  </div>
  <p class="hint" data-i18n="optLogHint"></p>

  <h2 data-i18n="optHCompound"></h2>
  <div class="row">
    <label for="compoundMode" data-i18n="optCompoundLabel"></label>
    <select id="compoundMode">
      <option value="query" data-i18n="optCompQuery"></option>
      <option value="index" data-i18n="optCompIndex"></option>
    </select>
  </div>
  <p class="hint"><b data-i18n="optCompQueryHead"></b><span data-i18n="optCompQueryText"></span></p>
  <p class="hint"><b data-i18n="optCompIndexHead"></b><span data-i18n="optCompIndexText"></span></p>
  <div id="compoundInfo" class="hint"></div>

  <h2 data-i18n="optHLangs"></h2>
  <div class="row" id="langs">
    <label><input type="checkbox" value="de"> Deutsch</label>
    <label><input type="checkbox" value="en"> English</label>
    <label><input type="checkbox" value="fr"> Français</label>
    <label><input type="checkbox" value="es"> Español</label>
  </div>
  <p class="hint" data-i18n="optLangsHint"></p>

  <h2 data-i18n="optHPrivacy"></h2>
  <p class="hint" data-i18n="optPrivacyText"></p>

  <h2 data-i18n="optHVersion"></h2>
  <p class="hint" data-i18n="optVersionText"></p>

  <h2 data-i18n="optHMaint"></h2>
  <div class="row">
    <button id="maintain" data-i18n="optMaintain"></button>
    <button id="reindex" data-i18n="optReindex"></button>
    <button id="delete" class="danger" data-i18n="optDelete"></button>
  </div>
  <p class="hint" data-i18n="optMaintHint"></p>
  <div id="msg"></div>

  <h2 data-i18n="optHLogging"></h2>
  <div class="row"><label><input type="checkbox" id="logging"> <span data-i18n="optLogging"></span></label></div>
  <p class="hint" data-i18n="optLoggingHint"></p>
  <div class="row">
    <span id="logCount"></span>
    <button id="export" data-i18n="optExport"></button>
    <button id="clearLog" data-i18n="optClearLog"></button>
  </div>

  <script src="options.js"></script>
</body>
</html>

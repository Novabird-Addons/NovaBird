# NovaBird auf macOS (Apple Silicon), Thunderbird headless mit Testprofil:
#  - search: NovaBird-Search ohne Helper (Modell im Add-on per WebAssembly), Bedeutungs- und Stichwortsuche
#  - ui: Oberfläche von 2.0 (Extension + Search) und 1.4 (Extension aus Branch testing): Bildschirmfotos, nichts ragt
#    über den Rand, Verfassen-Leiste unter den Fensterknöpfen; Gegenprobe ohne den Mac-Fix muss dabei scheitern.
# Ergebnisse als Tabelle in der Übersicht, Dateien (JSON, Bilder, Protokoll) als Artefakt.
# Stand 01.11.: Der Vortest läuft auf macOS mit jedem Add-on durch; ui.js und semantic.js blieben dort nach „start“
# stehen (mit und ohne Fenster). Der Vortest grenzt die Ursache mit Varianten ein (tools/tbtest/bisect), search und ui
# sind bis dahin ausgesetzt.
name: macOS

on:
  workflow_dispatch:
  push:
    branches: [novabird-2.0, testing]
    paths:
      - "novabird-search/**"
      - "novabird-extension/**"
      - "shared/**"
      - "tools/tbtest/**"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  # Vortest (wenige Minuten): läuft ein Testskript in Thunderbird weiter – ohne Add-on, nur mit der Extension, nur mit
  # Search? Von außen nach 60 s Bildschirmfoto und Stack-Abzug (sample) von Thunderbird, falls etwas alles blockiert.
  smoke:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Thunderbird laden
        run: |
          curl -fsSL -o tb.dmg "https://download.mozilla.org/?product=thunderbird-latest-SSL&os=osx&lang=de"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/tb tb.dmg
          cp -R /Volumes/tb/Thunderbird*.app "$RUNNER_TEMP/Thunderbird.app"
          hdiutil detach -quiet /Volumes/tb

      - name: Add-ons bauen
        run: |
          python tools/tbtest/build.py novabird-extension xpi/novabird-extension.xpi
          python tools/tbtest/build.py novabird-search xpi/novabird-search.xpi

      - name: Vortest (ohne Add-on, Extension, Search) und Eingrenzung (Varianten mit Extension)
        run: |
          mkdir -p out
          run() { # name, skript, add-on
            (
              sleep 50
              pid=$(pgrep -f "profile-new-smoke-$1" | head -1)
              screencapture -x "out/screen-50s-$1.png" || true
              [ -n "$pid" ] && sample "$pid" 3 -file "out/sample-$1.txt" > /dev/null 2>&1 || true
            ) &
            python -u tools/tbtest/run.py --timeout 70 --port 2828 --tb "$RUNNER_TEMP/Thunderbird.app/Contents/MacOS/thunderbird" \
              --profile "$RUNNER_TEMP/profile-new-smoke-$1" --mbox tools/tbtest/sem.mbox --js "$2" \
              --out "out/smoke-$1.json" --log "out/smoke-$1.log" --env NBPROGRESS="$GITHUB_WORKSPACE/out/smoke-$1-progress.json" $3 || true
            wait
            ok=$(python -c "import json,sys; r=json.load(open(sys.argv[1])) if __import__('os').path.exists(sys.argv[1]) else None; print('ja' if r and r.get('pass') else 'nein')" "out/smoke-$1.json")
            last=$(python -c "import json,sys; print(json.load(open(sys.argv[1])).get('step'))" "out/smoke-$1-progress.json" 2>/dev/null || echo "keine Marke")
            echo "| $1 | $(basename "$2") | $ok | $last |" | tee -a out/tabelle.md
          }
          echo "| Lauf | Skript | fertig | letzte Marke |" > out/tabelle.md
          echo "|---|---|---|---|" >> out/tabelle.md
          run ohne tools/tbtest/smoke.js ""
          run extension tools/tbtest/smoke.js xpi/novabird-extension.xpi
          run search tools/tbtest/smoke.js xpi/novabird-search.xpi
          run v2 tools/tbtest/bisect/v2-import-oben.js xpi/novabird-extension.xpi
          run v3 tools/tbtest/bisect/v3-frist-oben.js xpi/novabird-extension.xpi
          run v4 tools/tbtest/bisect/v4-ui-anfang.js xpi/novabird-extension.xpi
          run ui tools/tbtest/ui.js xpi/novabird-extension.xpi
          { echo "### Vortest und Eingrenzung"; cat out/tabelle.md; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "| nein |" out/tabelle.md && exit 1 || exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: out/

  search:
    needs: smoke
    if: false # ausgesetzt, bis der Vortest die Ursache für das Stehenbleiben auf macOS eingegrenzt hat
    strategy:
      fail-fast: false
      matrix:
        tb: [release, esr]
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Thunderbird ${{ matrix.tb }} laden
        run: |
          product=$([ "${{ matrix.tb }}" = esr ] && echo thunderbird-esr-latest-SSL || echo thunderbird-latest-SSL)
          curl -fsSL -o tb.dmg "https://download.mozilla.org/?product=$product&os=osx&lang=de"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/tb tb.dmg
          cp -R /Volumes/tb/Thunderbird*.app "$RUNNER_TEMP/Thunderbird.app"
          hdiutil detach -quiet /Volumes/tb
          "$RUNNER_TEMP/Thunderbird.app/Contents/MacOS/thunderbird" --version

      - name: Modell aus dem Cache
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: model
          key: jina-de-3f9eede8

      - name: Modell laden (Hugging Face, feste Revision)
        run: |
          mkdir -p model
          base="https://huggingface.co/jinaai/jina-embeddings-v2-base-de/resolve/3f9eede875721714945b6a99a3198299243cf2be"
          for f in config.json tokenizer.json tokenizer_config.json onnx/model_fp16.onnx; do
            [ -f "model/$f" ] || curl -fsSL --create-dirs -o "model/$f" "$base/$f"
          done
          ls -lR model

      # auch speichern, wenn der Test danach scheitert (actions/cache speichert sonst nur bei Erfolg)
      - name: Modell in den Cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: model
          key: jina-de-3f9eede8

      - name: NovaBird-Search bauen
        run: python tools/tbtest/build.py novabird-search out/novabird-search.xpi

      - name: Test
        run: |
          # Modell über einen lokalen Server wie bei Hugging Face (das Add-on prüft es mit seinen Prüfsummen)
          python tools/tbtest/modelserver.py model 18765 &
          python -u tools/tbtest/run.py --tb "$RUNNER_TEMP/Thunderbird.app/Contents/MacOS/thunderbird" \
            --timeout 1380 --profile "$RUNNER_TEMP/profile-new-search" --mbox tools/tbtest/sem.mbox --js tools/tbtest/semantic.js \
            --out out/result.json --shot out/screen.png --log out/tb.log \
            --env NBTESTBASE=http://127.0.0.1:18765/ --env NBPROGRESS="$GITHUB_WORKSPACE/out/progress.json" --env NBDEADLINE=1200 \
            out/novabird-search.xpi

      - name: Zusammenfassung
        if: always()
        run: python tools/tbtest/summary.py "Suche · Thunderbird ${{ matrix.tb }}" out/result.json out/progress.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ matrix.tb }}
          path: out/

  ui:
    needs: smoke
    if: false # ausgesetzt, siehe search
    strategy:
      fail-fast: false
      matrix:
        tb: [release, esr]
        line: ["2.0", "1.4"]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Branch testing (1.4) holen
        if: matrix.line == '1.4'
        uses: actions/checkout@v4
        with:
          ref: testing
          path: v14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Thunderbird ${{ matrix.tb }} laden
        run: |
          product=$([ "${{ matrix.tb }}" = esr ] && echo thunderbird-esr-latest-SSL || echo thunderbird-latest-SSL)
          curl -fsSL -o tb.dmg "https://download.mozilla.org/?product=$product&os=osx&lang=de"
          hdiutil attach -nobrowse -quiet -mountpoint /Volumes/tb tb.dmg
          cp -R /Volumes/tb/Thunderbird*.app "$RUNNER_TEMP/Thunderbird.app"
          hdiutil detach -quiet /Volumes/tb

      - name: Add-ons bauen
        run: |
          if [ "${{ matrix.line }}" = "1.4" ]; then
            python tools/tbtest/build.py novabird-extension out/novabird-extension.xpi --root v14
            src=v14
          else
            python tools/tbtest/build.py novabird-extension out/novabird-extension.xpi
            python tools/tbtest/build.py novabird-search out/novabird-search.xpi
            src=.
          fi
          # Gegenprobe: dieselbe Extension ohne den Mac-Fix der Verfassen-Leiste
          mkdir -p "$RUNNER_TEMP/ohnefix"
          cp -R "$src/novabird-extension" "$src/shared" "$RUNNER_TEMP/ohnefix/"
          python tools/tbtest/strip_mac_fix.py "$RUNNER_TEMP/ohnefix/novabird-extension/css/compose.css"
          python tools/tbtest/build.py novabird-extension out/ohnefix/novabird-extension.xpi --root "$RUNNER_TEMP/ohnefix"

      - name: Test
        run: |
          mkdir -p out/bilder
          python -u tools/tbtest/run.py --tb "$RUNNER_TEMP/Thunderbird.app/Contents/MacOS/thunderbird" \
            --timeout 480 --profile "$RUNNER_TEMP/profile-new-ui" --mbox tools/tbtest/sem.mbox --js tools/tbtest/ui.js \
            --out out/ui.json --log out/ui.log \
            --env NBSHOTS="$GITHUB_WORKSPACE/out/bilder" --env NBPROGRESS="$GITHUB_WORKSPACE/out/ui-progress.json" --env NBDEADLINE=600 \
            out/*.xpi

      - name: Gegenprobe ohne Mac-Fix (muss bei „Senden unter den Fensterknöpfen“ scheitern)
        if: always()
        run: |
          mkdir -p out/ohnefix/bilder
          python -u tools/tbtest/run.py --tb "$RUNNER_TEMP/Thunderbird.app/Contents/MacOS/thunderbird" \
            --timeout 480 --port 2829 --profile "$RUNNER_TEMP/profile-new-ohnefix" --mbox tools/tbtest/sem.mbox --js tools/tbtest/ui.js \
            --out out/ohnefix/ui.json --log out/ohnefix/ui.log \
            --env NBSHOTS="$GITHUB_WORKSPACE/out/ohnefix/bilder" --env NBDEADLINE=600 \
            out/ohnefix/novabird-extension.xpi || true
          python - <<'EOF'
          import json, sys
          r = json.load(open("out/ohnefix/ui.json"))
          c = (r or {}).get("checks", {}).get("macOS: „Senden“ unter den Fensterknöpfen")
          print("Gegenprobe:", c)
          sys.exit(0 if c and not c["ok"] else 1)  # die Prüfung muss den Fehler ohne Fix erkennen
          EOF

      - name: Zusammenfassung
        if: always()
        run: |
          python tools/tbtest/summary.py "Oberfläche ${{ matrix.line }} · Thunderbird ${{ matrix.tb }}" out/ui.json out/ui-progress.json >> "$GITHUB_STEP_SUMMARY"
          python tools/tbtest/summary.py "Gegenprobe ohne Mac-Fix ${{ matrix.line }} · Thunderbird ${{ matrix.tb }} (❌ bei „Senden“ erwartet)" out/ohnefix/ui.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.line }}-${{ matrix.tb }}
          path: out/
